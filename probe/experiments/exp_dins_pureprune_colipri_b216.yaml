encoder: colipri
compression:
  method: medpruner_dins
  budget: 216
  params: {merge_residual: false}
probe:
  families: [disease, size, density, location, radiomics]
  epochs: 10
  bs: 128
  seeds: [2026]
data:
  limit: 0
  num_workers: 12
