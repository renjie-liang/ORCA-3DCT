exp_id: exp_abl_conn18_colipri_b64
desc: "ORCA+sin f4s2 merge-param ablation (conn18) @ b64 colipri, vs default 6-conn/ward/no-norm."
encoder: colipri
compression:
  method: agglo_merge
  budget: 64
  params: {centroid: true, centroid_encoding: sinusoidal, centroid_freqs: 4, centroid_scale: 2.0, connectivity: 18}
probe:
  families: [disease, size, density, location, radiomics]
  epochs: 10
  bs: 128
  seeds: [2026]
data:
  limit: 0
  num_workers: 12
