# DTBD3D baseline reproduction — BTB3D 16x16x8
#
# Source of values: 3DCT_Encoder/adapters/slurm_btb3d_report_gen.sh (verified
# to have run in the user's prior environment) plus BTB3D paper §4.2.
#
# This is a documentation file — values are read by REPRO_PLAYBOOK.md
# command-line invocations. Inference does NOT need re-extraction; we
# already have the post-VQ tokens at btb3d_embeddings/16x16x8/valid/.

compression: 16x16x8
split: valid

# Token shape (verified at adapters/extract_btb3d.py and verify_btb3d_recon)
tokens:
  layout:        [31, 32, 32]      # T x H x W
  per_volume:    31744             # 31 * 32 * 32
  dim:           18                # LFQ binary {-1, +1}^18
  codebook_size: 262144            # 2^18

# Reconstruction reference (BTB3D paper Table 1, Stage 3)
reference_recon_metrics:
  psnr_db: 26.75
  ssim:    0.749
  mse:     0.002

# Report-generation reference (BTB3D paper Table 3, CT-RATE valid)
reference_report_metrics:
  clinical_f1:        0.258
  clinical_precision: 0.260
  clinical_recall:    0.260
  crg:                0.370
  bleu_1:             0.439
  bleu_2:             0.320
  bleu_3:             0.248
  bleu_4:             0.213
  bleu_mean:          0.305
  meteor:             0.223

# Resources for inference (NOT training — training is BTB3D's official 40 GPU run)
inference:
  partition:           hpg-b200
  gpus_per_node:       1
  cpus_per_task:       8
  mem_gb:              64
  est_time_hours:
    smoke_100:  0.5     # 100 volumes
    full_valid: 4.0     # 3039 CT-RATE valid report-generation volumes

# Paths — ABSOLUTE, deliberately (repointed 2026-07-16).
# These were relative and resolved by _path() against PROJECT_ROOT to CompressToken/Experiment/core_code/
# data_links/ — a directory that has never existed here. Every one of them was DEAD. Nothing failed, because
# the MCQ cells override MANIFEST/TRAIN_VQA_JSON/MODEL_PATH via env and the sbatch PYTHONPATH covered
# btb3d_repo, so the dead defaults were simply never read. Report-gen WOULD have hit them immediately
# (it needs reports_csv/labels_csv/radbert_ckpt). Same failure mode as the stale VQA labels: a fallback that
# cannot fail hides a wrong path. These four roots are stable and are pinned absolutely on purpose.
paths:
  llava_repo:    ./llm_engine        # the directory holding the `llava` package
  model_path:    ./llm_engine/base/llava_config  # LLaVA config only (--init-from-scratch)
  model_base:    ./checkpoints/Llama-3.1-8B-Instruct
  vqa_json:      ./data/vqa/valid_reportgen.json      # report-gen split (train_vqa.json alongside)
  embed_path:    ./checkpoints/BTB3D/report_generation                 # btb3d tokens; unused by the colipri sweeps
  reports_csv:   ./data/reports/validation_reports.csv
  labels_csv:    ./data/labels/valid_predicted_labels.csv
  radbert_ckpt:  ./checkpoints/RadBertClassifier.pth

# multigpu_llava_eval.py invocation (matches the prior verified run)
llava_eval_args:
  conv_mode:           llama3
  temperature:         0
  max_new_tokens:      512
  repetition_penalty:  1.3
  type_filter:         report_generation
  num_gpus:            1
  node_index:          0
  total_nodes:         1
  merge_tokens:        false        # 16x16x8 uses raw 18-dim tokens

# Known issue tracking (REPRO_PLAYBOOK.md fills these in after smoke run)
known_repro_gap:
  reported_by_user:  true
  hypothesis: |
    The 16x16x8 reproduction did not previously match paper Table 3 (F1=0.258).
    Diagnostic dimensions to check during smoke run:
      D1 token equivalence (validate_btb3d_tokens.py codebook usage / shape)
      D2 reconstructible decode (verify_btb3d_recon.py PSNR vs reference 26.75)
      D3 training hparams (LoRA r=128, alpha=256, 40k iter, lr=2e-5, warmup=0.03)
      D4 valid split identity (vqa/valid_vqa.json must use the official 3039-volume report-generation split)
      D5 inference settings (T=0, max_new=512, rep_penalty=1.3 — matches prior run)
      D6 evaluator (RadBert classifier — verified same as paper, see crg_score.py tests)
